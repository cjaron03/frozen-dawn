[general]
	#Total in-game days until phase 6 atmospheric collapse is complete.
	#Fresh worlds start on the Default preset unless a different preset is selected.
	#Preset-managed: overwritten by /frozendawn preset command.
	# Default: 120
	# Range: 10 ~ 1000
	totalDays = 120
	#Skip ahead to this day for testing (0 = normal start)
	# Default: 0
	# Range: 0 ~ 1000
	startingDay = 0
	#Freeze apocalypse at current phase
	pauseProgression = false

[temperature]
	#Coldest surface temperature at phase 5 completion (Celsius).
	#Preset-managed: overwritten by /frozendawn preset command.
	# Default: -120
	# Range: -200 ~ 0
	basePhase5Temp = -120
	#Multiplier for depth-based warmth.
	#Preset-managed: overwritten by /frozendawn preset command.
	#Higher values = more warmth underground. Affects Geothermal Core effectiveness.
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	geothermalStrength = 1.0
	#Multiplier for heat source warmth (campfires, furnaces, Thermal Heaters, Geothermal Core).
	#Preset-managed: overwritten by /frozendawn preset command.
	#Performance note: higher values don't affect scan radius, only warmth output.
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	heatSourceMultiplier = 1.0

[client]
	#Enable progressive sky darkening and fog
	enableSkyDarkening = true
	#Enable frost screen overlay in cold areas
	enableFrostOverlay = true
	#Enable subtle camera effects from the sanity system.
	#Disable if you experience motion sickness. Audio and visual effects still play.
	enableSanityCameraEffects = true
	#Enable phase-dependent sky color shifting.
	#Shifts sky from warm amber (phase 1) through cold blue to black during phase 6 atmospheric collapse.
	enableSkyColorShift = true

[gameplay]
	#Enable Returned mob spawning in Phase 6+.
	#Intelligent reanimated ORSA personnel that open doors, break lights, and extinguish heaters.
	enableReturned = true
	#Multiplier for Frozen Dawn hostile spawn rates (Frostbitten, Frostmites, Hollow, Returned, Mimics, Architects).
	#Preset-managed: overwritten by /frozendawn preset command.
	#Affects spawn chance, density caps, and group size where applicable.
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	mobSpawnMultiplier = 1.0
	#Duration of the transponder broadcast in ticks.
	#Preset-managed: overwritten by /frozendawn preset command.
	#Default 120000 (~5 in-game days). Brutal: 192000. Cinematic: 72000.
	# Default: 120000
	# Range: 6000 ~ 480000
	broadcastTicks = 120000
	#TESTING ONLY: override transponder broadcast time in ticks.
	#Set to 0 to use the preset-managed broadcastTicks value.
	#100 ticks = 5 seconds.
	# Default: 0
	# Range: 0 ~ 480000
	testBroadcastTicksOverride = 100
	#Environment and survival pressure.
	#Enable vegetation freezing and decay
	enableVegetationDecay = true
	#Enable Frostbitten mob spawning in Phase 4+.
	#Reanimated frost-covered humanoids that emerge from frozen ground.
	enableFrostbitten = true
	#Phase at which coal ore begins freezing (requires enableFuelScarcity = true)
	# Default: 4
	# Range: 2 ~ 5
	fuelScarcityPhase = 4
	#Enable the win condition system (crashed satellite, transponder, broadcast).
	#When disabled: satellite doesn't spawn, compass spins, schematic doesn't exist.
	#For endless survival players who prefer no endgame goal.
	enableWinCondition = true
	#Enable Returned Architect spawning in Phase 6+.
	#Intelligent mob that breaks through player-built walls and scaffolds over defenses.
	enableArchitect = true
	#Enable coal ore freezing into Frozen Coal Ore in later phases.
	#When enabled, surface coal ore (Y >= 0) converts to Frozen Coal Ore,
	#which drops less coal and has a chance to drop ice shards.
	enableFuelScarcity = true
	#Enable lava freezing in later phases
	enableLavaFreezing = true
	#Enable Frostmite spawning and infestations in late phases.
	#Tiny heat-draining ice parasites that swarm players and heaters.
	enableFrostmite = true
	#Enable the isolation/sanity system (psychological effects in prolonged isolation)
	enableSanity = true
	#Enable Hollow mob spawning in Phase 5+.
	#Translucent vapor entities that suppress sound and entomb players in ice.
	enableHollow = true
	#World narrative and endgame progression.
	#Enable ORSA lore books in structure loot tables.
	#When enabled, written books containing the ORSA narrative
	#are injected into village, temple, mineshaft, and stronghold chests.
	enableLoreBooks = true
	#Suppress natural non-Frozen-Dawn hostile spawns in the Overworld from phase 4 onward.
	#Frozen Dawn hostile spawners still run normally.
	#Does not affect spawn eggs, scripted spawns, or structure spawns.
	enableNaturalHostileSpawnSuppression = true
	#Enable mob freezing on cold surfaces
	enableMobFreezing = true
	#Enable phase-based fuel consumption scaling for Thermal Heaters.
	#Phases 1-3: 1x, Phase 4: 2x, Phase 5: 4x, Phase 6: 8x.
	#Stacks with tier consumption rate. Geothermal Core is exempt.
	#Disable to remove fuel logistics pressure without affecting cold.
	enableFuelPhaseScaling = true
	#Multiplier for snow accumulation speed.
	#Preset-managed: overwritten by /frozendawn preset command.
	#Performance note: higher values increase snow layer updates per tick.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	snowAccumulationRate = 1.0
	#Multiplier for sanity degradation speed.
	#Preset-managed: overwritten by /frozendawn preset command.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	sanitySpeedMultiplier = 1.0
	#Enable Returned Mimic spawning in Phase 6+ (progress > 50%).
	#Disguises itself as a shadow figure, then attacks when approached.
	enableMimic = true
	#Natural spawn suppression and hostile roster.
	#Suppress natural passive spawns in the Overworld from phase 4 onward.
	#Affects only natural passive categories (land animals and peaceful water life).
	#Does not affect breeding, spawn eggs, scripted spawns, or structure spawns.
	enableNaturalPassiveSpawnSuppression = true
