// Local automation must never be part of the distributed mod.
tasks.register('verifyLabBridgePackaging') {
    dependsOn tasks.named('jar'), tasks.named('compileLabBridgeJava')
    doLast {
        def labClassPaths = sourceSets.labBridge.output.classesDirs.files.collectMany { dir ->
            fileTree(dir).matching { include '**/*.class' }.files.collect { dir.toPath().relativize(it.toPath()).toString() }
        }.toSet()
        def leaked = zipTree(tasks.named('jar').get().archiveFile).matching {
            include { entry -> labClassPaths.contains(entry.path) }
        }.files
        if (!leaked.empty) throw new GradleException("Development command bridge leaked into release jar")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyLabBridgePackaging') }

