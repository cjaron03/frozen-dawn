plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def enableEnhancedClassRedefinition = providers
        .gradleProperty('fdEnableEnhancedClassRedefinition')
        .map { it.toBoolean() }
        .getOrElse(false)

repositories {
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def gameTestReport = layout.buildDirectory.file('gametest/report.xml')
def gameTestRunDirectory = layout.buildDirectory.dir('gametest/run')
def monkeyReport = layout.buildDirectory.file('architect-monkey/report.xml')
def monkeyRunDirectory = layout.buildDirectory.dir('architect-monkey/run')
def monkeyReports = layout.buildDirectory.dir('architect-monkey-reports/' + java.util.UUID.randomUUID().toString())
def architectReports = layout.buildDirectory.dir('architect-reports/' + java.util.UUID.randomUUID().toString())
// Second dev client for multiplayer testing. Its own game directory: two JVMs sharing
// run/ fight over the session lock and latest.log.
def client2RunDirectory = layout.projectDirectory.dir('run2')

// Minecraft GameTests live in their own source set: they stay out of the published jar
// and off the JUnit classpath, but are registered with the mod below so that NeoForge's
// annotation scan (ModList#getAllScanData) can find the @GameTestHolder classes.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            if (enableEnhancedClassRedefinition) {
                jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
        }

        clientLab {
            client()
            gameDirectory = layout.projectDirectory.dir('run-lab')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            systemProperty 'frozendawn.debug.architect', 'true'
            systemProperty 'frozendawn.debug.architectSeed', '1'
        }

        // A second local player for LAN disconnect/reconnect tests. Keep saves,
        // options, and logs separate from the host in run-lab.
        clientLabGuest {
            client()
            gameDirectory = layout.projectDirectory.dir('runs/architect-guest')
            programArguments.addAll '--username', 'ArchitectGuest'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            systemProperty 'frozendawn.debug.architect', 'true'
            systemProperty 'frozendawn.debug.architectSeed', '1'
        }

        clientDebug {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5006'
            if (enableEnhancedClassRedefinition) {
                jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
        }

        client2 {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            programArguments.addAll '--username', 'Dev2'
            gameDirectory = client2RunDirectory
            if (enableEnhancedClassRedefinition) {
                jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.gametest.report', gameTestReport.get().asFile.absolutePath
            systemProperty 'frozendawn.architect.reports', architectReports.get().asFile.absolutePath
            // Its own throwaway world, wiped before every run. Sharing run/ with runClient let
            // saved data from one gate run leak into the next, which makes any test that touches
            // world state depend on what happened last time.
            gameDirectory = gameTestRunDirectory
        }

        architectMonkeyServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.gametest.report', monkeyReport.get().asFile.absolutePath
            systemProperty 'frozendawn.architect.reports', monkeyReports.get().asFile.absolutePath
            systemProperty 'frozendawn.architect.monkey', 'true'
            gameDirectory = monkeyRunDirectory
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(project.mod_id)
    }
}

// Puts Minecraft and NeoForge on the gameTest compile/runtime classpath. Only the main
// source set gets these implicitly.
neoForge.addModdingDependenciesTo(sourceSets.gameTest)

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    gameTestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from('AUDIO_NOTICE.md') {
        into 'META-INF/frozendawn'
    }
    from('tools/audio_sources/generated_voice/NOTICE.md') {
        into 'META-INF/frozendawn'
        rename { 'GENERATED_VOICE_NOTICE.md' }
    }
    from('docs/audio/SHIPPED_AUDIO_INVENTORY.tsv') {
        into 'META-INF/frozendawn'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/gameTest/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// --- Release gate -----------------------------------------------------------------------
//
// runGameTestServer alone is not a gate. Vanilla's net.minecraft.server.Main wraps startup in
// a catch that only logs, so a server that dies before the tests run still exits 0 and Gradle
// still prints BUILD SUCCESSFUL. Test failures do fail the build (GameTestServer#onServerExit
// exits with the failed count), but everything before that point is invisible.
//
// So the gate checks for a positive result artifact instead of trusting the exit code: the
// JUnit-style report only exists if the run actually reached and finished a test batch.
tasks.named('runGameTestServer') {
    def report = gameTestReport
    def runDirectory = gameTestRunDirectory
    doFirst {
        // A stale report from an earlier green run would otherwise mask a crash today.
        def file = report.get().asFile
        file.parentFile.mkdirs()
        file.delete()
        // Every gate run starts from an empty world, so results do not depend on run order.
        delete(runDirectory)
    }
}

tasks.register('gameTestGate', Exec) {
    group = 'verification'
    description = 'Requires every named Architect GameTest and validates its current-build report.'
    dependsOn tasks.named('runGameTestServer')
    commandLine 'python3', '-B', 'tools/verify_architect_gate.py',
            '--report', gameTestReport.get().asFile.absolutePath,
            '--required', file('config/architect-required-tests.txt').absolutePath,
            '--artifacts', architectReports.get().asFile.absolutePath,
            '--build-info', layout.buildDirectory.file('resources/main/architect-build.properties').get().asFile.absolutePath
}

// Fingerprint the actual source/resources, including uncommitted changes. No git commit needed.
def architectBuildInfo = layout.buildDirectory.dir('generated/architectBuildInfo')
tasks.register('generateArchitectBuildInfo') {
    inputs.files(fileTree('src/main'), fileTree('src/gameTest'), fileTree('src/test'),
            file('build.gradle'), file('gradle.properties'))
    outputs.dir(architectBuildInfo)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        inputs.files.files.sort { project.relativePath(it) }.each { input ->
            digest.update(project.relativePath(input).getBytes('UTF-8'))
            digest.update((byte) 0)
            digest.update(input.bytes)
        }
        def out = architectBuildInfo.get().file('architect-build.properties').asFile
        out.parentFile.mkdirs()
        out.text = "version=${project.version}\nsourceSha256=${java.util.HexFormat.of().formatHex(digest.digest())}\n"
    }
}
tasks.named('processResources') {
    dependsOn tasks.named('generateArchitectBuildInfo')
    from(architectBuildInfo)
}
tasks.register('verifyArchitectFixtures', Exec) {
    group = 'verification'
    description = 'Rejects stale shared Architect lab/GameTest structures.'
    commandLine 'python3', 'tools/architect_fixtures.py', '--check'
}
tasks.named('check') { dependsOn tasks.named('verifyArchitectFixtures') }
tasks.register('architectVerify') {
    group = 'verification'
    description = 'Builds the mod and runs the required Architect regression and harness tests.'
    dependsOn tasks.named('build'), tasks.named('gameTestGate')
}

tasks.register('testArchitectGate', Exec) {
    group = 'verification'
    commandLine 'python3', '-B', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-p', 'test_architect_gate.py'
}
tasks.named('check') { dependsOn tasks.named('testArchitectGate') }

// Source-of-truth §9.16a: keep the sole Maeve entry point a narrow facade.
tasks.register('verifyMaeveFacade') {
    group = 'verification'
    def facade = file('src/main/java/com/frozendawn/maeve/MaeveDirector.java')
    inputs.file(facade)
    doLast {
        int lines = facade.readLines('UTF-8').size()
        if (lines > 300) throw new GradleException("MaeveDirector exceeds its 300-line facade budget: ${lines}")
    }
}
tasks.named('check') { dependsOn tasks.named('verifyMaeveFacade') }

// Reproducible exploratory cases. Failures remain failures and keep their traces.
tasks.named('runArchitectMonkeyServer') {
    doFirst {
        delete(monkeyReport)
        delete(monkeyRunDirectory)
    }
}
tasks.register('architectMonkey', Exec) {
    group = 'verification'
    description = 'Runs the Architect terrain/event stress matrix and rejects any failed or missing case.'
    dependsOn tasks.named('runArchitectMonkeyServer')
    commandLine 'python3', '-B', 'tools/verify_architect_gate.py',
            '--report', monkeyReport.get().asFile.absolutePath,
            '--required', file('config/architect-monkey-tests.txt').absolutePath,
            '--artifacts', monkeyReports.get().asFile.absolutePath,
            '--build-info', layout.buildDirectory.file('resources/main/architect-build.properties').get().asFile.absolutePath
}

tasks.register('architectMonkeySummary', Exec) {
    group = 'verification'
    description = 'Preserves the gameplay XML and a per-case stress matrix, including failed runs.'
    commandLine 'python3', '-B', 'tools/summarize_architect_monkey.py',
            '--report', monkeyReport.get().asFile.absolutePath,
            '--required', file('config/architect-monkey-tests.txt').absolutePath,
            '--artifacts', monkeyReports.get().asFile.absolutePath
}
tasks.named('runArchitectMonkeyServer') { finalizedBy tasks.named('architectMonkeySummary') }

// Parse the very same disposable-world functions during the mandatory GameTests.
def maeveWorldQaResources = layout.buildDirectory.dir('generated/maeve-world-qa')
tasks.register('generateMaeveWorldQa', Exec) {
    inputs.file('tools/prepare_maeve_world_playtest.py')
    outputs.dir(maeveWorldQaResources)
    commandLine 'python3', '-B', 'tools/prepare_maeve_world_playtest.py', '--pack-only', maeveWorldQaResources.get().asFile.absolutePath
}
sourceSets.gameTest.resources.srcDir(maeveWorldQaResources)

def maeveAttentionQaResources = layout.buildDirectory.dir('generated/maeve-attention-qa')
tasks.register('generateMaeveAttentionQa', Exec) {
    inputs.file('tools/prepare_maeve_attention_playtest.py')
    inputs.file('tools/prepare_maeve_attention_coop.py')
    outputs.dir(maeveAttentionQaResources)
    commandLine 'python3', '-B', 'tools/prepare_maeve_attention_playtest.py', '--pack-only', maeveAttentionQaResources.get().asFile.absolutePath
}
sourceSets.gameTest.resources.srcDir(maeveAttentionQaResources)

def macsReconQaResources = layout.buildDirectory.dir('generated/macs-recon-qa')
tasks.register('generateMacsReconQa', Exec) {
    inputs.file('tools/prepare_macs_recon_playtest.py')
    outputs.dir(macsReconQaResources)
    commandLine 'python3', '-B', 'tools/prepare_macs_recon_playtest.py', '--pack-only', macsReconQaResources.get().asFile.absolutePath
}
sourceSets.gameTest.resources.srcDir(macsReconQaResources)
tasks.named('processGameTestResources') { dependsOn tasks.named('generateMacsReconQa') }
tasks.named('processGameTestResources') { dependsOn tasks.named('generateMaeveAttentionQa') }
tasks.named('processGameTestResources') { dependsOn tasks.named('generateMaeveWorldQa') }
