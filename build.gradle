plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def enableEnhancedClassRedefinition = providers
        .gradleProperty('fdEnableEnhancedClassRedefinition')
        .map { it.toBoolean() }
        .getOrElse(false)

repositories {
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def gameTestReport = layout.buildDirectory.file('gametest/report.xml')
def gameTestRunDirectory = layout.buildDirectory.dir('gametest/run')

// Minecraft GameTests live in their own source set: they stay out of the published jar
// and off the JUnit classpath, but are registered with the mod below so that NeoForge's
// annotation scan (ModList#getAllScanData) can find the @GameTestHolder classes.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            if (enableEnhancedClassRedefinition) {
                jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
        }

        clientDebug {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.dev.skipOrsaAwakening', 'true'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5006'
            if (enableEnhancedClassRedefinition) {
                jvmArgument '-XX:+AllowEnhancedClassRedefinition'
            }
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
            jvmArgument '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005'
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'frozendawn.gametest.report', gameTestReport.get().asFile.absolutePath
            // Its own throwaway world, wiped before every run. Sharing run/ with runClient let
            // saved data from one gate run leak into the next, which makes any test that touches
            // world state depend on what happened last time.
            gameDirectory = gameTestRunDirectory
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    unitTest {
        enable()
        testedMod = mods.named(project.mod_id)
    }
}

// Puts Minecraft and NeoForge on the gameTest compile/runtime classpath. Only the main
// source set gets these implicitly.
neoForge.addModdingDependenciesTo(sourceSets.gameTest)

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testRuntimeClasspath.extendsFrom localRuntime
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    gameTestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    from('AUDIO_NOTICE.md') {
        into 'META-INF/frozendawn'
    }
    from('tools/audio_sources/generated_voice/NOTICE.md') {
        into 'META-INF/frozendawn'
        rename { 'GENERATED_VOICE_NOTICE.md' }
    }
    from('docs/audio/SHIPPED_AUDIO_INVENTORY.tsv') {
        into 'META-INF/frozendawn'
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/gameTest/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        leadingTabsToSpaces(4)
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// --- Release gate -----------------------------------------------------------------------
//
// runGameTestServer alone is not a gate. Vanilla's net.minecraft.server.Main wraps startup in
// a catch that only logs, so a server that dies before the tests run still exits 0 and Gradle
// still prints BUILD SUCCESSFUL. Test failures do fail the build (GameTestServer#onServerExit
// exits with the failed count), but everything before that point is invisible.
//
// So the gate checks for a positive result artifact instead of trusting the exit code: the
// JUnit-style report only exists if the run actually reached and finished a test batch.
tasks.named('runGameTestServer') {
    def report = gameTestReport
    def runDirectory = gameTestRunDirectory
    doFirst {
        // A stale report from an earlier green run would otherwise mask a crash today.
        def file = report.get().asFile
        file.parentFile.mkdirs()
        file.delete()
        // Every gate run starts from an empty world, so results do not depend on run order.
        delete(runDirectory)
    }
}

tasks.register('gameTestGate') {
    group = 'verification'
    description = 'Runs the Frozen Dawn game tests and fails if the run did not actually happen.'
    dependsOn tasks.named('runGameTestServer')

    def report = gameTestReport
    doLast {
        def file = report.get().asFile
        if (!file.exists()) {
            throw new GradleException(
                    "Game test gate failed: no report at ${file}.\n" +
                    "The game test server exited without completing a test batch. Minecraft logs " +
                    "this as an ERROR and then exits 0, so scroll up for 'Failed to start the " +
                    "minecraft server' or a mod loading error — the exit code will not show it.")
        }

        def suite = new groovy.xml.XmlSlurper().parse(file)
        def cases = suite.'**'.findAll { it.name() == 'testcase' }
        def failures = suite.'**'.findAll { it.name() == 'failure' }

        if (cases.isEmpty()) {
            throw new GradleException(
                    "Game test gate failed: ${file} records no tests. The server started but ran " +
                    "nothing, so this build verified no gameplay behaviour at all.")
        }
        if (!failures.isEmpty()) {
            def detail = failures.collect { "  - ${it.@message}" }.join('\n')
            throw new GradleException(
                    "Game test gate failed: ${failures.size()} of ${cases.size()} game tests " +
                    "failed.\n${detail}")
        }

        logger.lifecycle("Game test gate passed: ${cases.size()} game tests ran, 0 failures.")
    }
}
